<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
<title id="title">Professor Bot — Cyber Blue</title><desc id="desc">Minimal animated coding banner with creator credits Ali Asghar and Mohsin Ali.</desc>
<defs><linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00D4FF"/><stop offset="1" stop-color="#147DCE"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1280" height="430" rx="24" fill="#080D16"/>
<g fill="#00D4FF" opacity=".55"><circle cx="70" cy="65" r="3"/><circle cx="100" cy="65" r="3"/><circle cx="130" cy="65" r="3"/><circle cx="1150" cy="65" r="3"/><circle cx="1180" cy="65" r="3"/><circle cx="1210" cy="65" r="3"/></g>
<text x="640" y="70" text-anchor="middle" fill="#8FCFFF" font-family="Arial,sans-serif" font-size="20" letter-spacing="5">OPEN SOURCE • WHATSAPP UTILITY PROJECT</text>
<text x="640" y="145" text-anchor="middle" font-family="Arial,sans-serif" font-size="66" font-weight="800" fill="#EAF6FF">PROFESSOR <tspan fill="#00D4FF">BOT</tspan></text>
<text x="640" y="184" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#B8D8EA">A smart WhatsApp utility bot built with Node.js &amp; Baileys</text>
<g transform="translate(640 280)" filter="url(#glow)">
<rect x="-105" y="-65" width="210" height="125" rx="13" fill="#0D1B2B" stroke="#00D4FF" stroke-width="5"/>
<path d="M-65 -22l-25 22 25 22M65 -22l25 22-25 22M15 -34l-30 68" fill="none" stroke="#00D4FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M-145 76h290l-22 20h-246z" fill="#147DCE" stroke="#00D4FF" stroke-width="4"/>
<circle r="145" fill="none" stroke="#147DCE" stroke-width="3" stroke-dasharray="12 16" opacity=".7"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/></circle>
<circle cx="0" cy="-145" r="7" fill="#00D4FF"><animate attributeName="opacity" values=".25;1;.25" dur="1.8s" repeatCount="indefinite"/></circle>
</g>
<g font-family="Arial,sans-serif" text-anchor="middle"><text x="245" y="390" fill="#8FCFFF" font-size="17" letter-spacing="3">DEVELOPED BY</text><text x="245" y="420" fill="#FFFFFF" font-size="29" font-weight="800">ALI ASGHAR</text><text x="1035" y="390" fill="#8FCFFF" font-size="17" letter-spacing="3">CO-DEVELOPER</text><text x="1035" y="420" fill="#FFFFFF" font-size="29" font-weight="800">MOHSIN ALI</text></g>
<path d="M0 350 Q320 315 500 350 T900 350 T1280 350" fill="none" stroke="url(#cyan)" stroke-width="5" opacity=".8"/>
</svg>